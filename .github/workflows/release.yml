name: release

# Fires on `vX.Y.Z` tag push. A maintainer cuts a release by running
# `make release-prep VERSION=x.y.z` locally, finalising the CHANGELOG,
# committing + pushing master, then pushing the tag — see the next-step
# checklist printed by `make release-prep`. This workflow then builds and
# uploads the cross-platform binaries to the GitHub Release (auto-created
# from the tag if not already there).

on:
  push:
    tags: ['v*.*.*']

permissions:
  # Need write access to upload the built archives + checksums to the
  # release page that GitHub auto-creates from the pushed tag.
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Tags + full history give goreleaser the inputs it needs to
          # populate the changelog block on the release page.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Homebrew formula in the codedeviate/homebrew-cli tap is bumped LOCALLY
  # as the last step of a release — `make homebrew-bump VERSION=x.y.z` runs that
  # tap's scripts/bump.sh and pushes Formula/sercon.rb. See the Makefile and
  # CLAUDE.md. (There is no CI job for this: it requires write access to a
  # second repo, which the default GITHUB_TOKEN lacks, and the maintainer cuts
  # releases by hand anyway.)
