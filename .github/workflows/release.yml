name: release

# Fires on `vX.Y.Z` tag push. A maintainer cuts a release by running
# `make release-prep VERSION=x.y.z` locally, finalising the CHANGELOG,
# committing + pushing master, then pushing the tag — see the next-step
# checklist printed by `make release-prep`. This workflow then builds and
# uploads the cross-platform binaries to the GitHub Release (auto-created
# from the tag if not already there).

on:
  push:
    tags: ['v*.*.*']

permissions:
  # Need write access to upload the built archives + checksums to the
  # release page that GitHub auto-creates from the pushed tag.
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Tags + full history give goreleaser the inputs it needs to
          # populate the changelog block on the release page.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After the release uploads, bump the Homebrew formula in the
  # codedeviate/homebrew-cli tap by reusing that tap's scripts/bump.sh
  # (recomputes sha256 + sed-replaces the url/sha in Formula/sercon.rb).
  # Skips cleanly if the HOMEBREW_TAP_GITHUB_TOKEN secret is absent — see
  # CLAUDE.md. The default GITHUB_TOKEN can't write to another repo, so the
  # checkout + push use the fine-grained tap PAT.
  homebrew:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Skip if no tap token
        id: guard
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_GITHUB_TOKEN not set — skipping Homebrew bump."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout tap
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v5
        with:
          repository: codedeviate/homebrew-cli
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - name: Bump + push formula
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail                        # fail loudly if bump.sh errors (e.g. tag unreachable)
          version="${GITHUB_REF_NAME#v}"           # v0.35.2 -> 0.35.2
          bash scripts/bump.sh sercon "$version"
          if git diff --quiet; then
            echo "Formula already at ${version}; nothing to commit."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Formula/sercon.rb              # scope the commit to just the formula
            git commit -m "sercon ${version}"
            git push origin HEAD
          fi
