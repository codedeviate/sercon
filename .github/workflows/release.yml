name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  # Need write access to upload the built archives + checksums to the
  # release page that GitHub auto-creates from the pushed tag.
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags + full history give goreleaser the inputs it needs to
          # populate the changelog block on the release page.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
