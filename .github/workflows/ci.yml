name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build & test (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 1.25 is the minimum we claim (driven by golang.org/x/text v0.37
        # and a few other deps); `stable` keeps us honest against whatever
        # the latest GA Go release is when CI runs.
        go: ['1.25', 'stable']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: build (cgo-free)
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags='-s -w' -o sercon ./cmd/sercon
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
      # Offline example scripts — async.ts, net-probe.ts and email-auth.ts
      # hit the real network so they're local-only via `make demo`.
      - name: smoke examples
        run: |
          ./sercon examples/scripts/smoke.ts \
            examples/scripts/console.ts \
            examples/scripts/hash.ts \
            examples/scripts/strings.ts \
            examples/scripts/path-and-time.ts \
            examples/scripts/default-export.ts \
            examples/scripts/tsx-demo.ts \
            examples/scripts/json-import.ts \
            examples/scripts/pkg-resolution.ts \
            examples/scripts/compression.ts \
            examples/scripts/barcode.ts \
            examples/scripts/charset.ts \
            examples/scripts/checkdigit.ts \
            examples/scripts/archive.ts \
            examples/scripts/diff.ts \
            examples/scripts/jq.ts \
            examples/scripts/exec-shell.ts \
            examples/scripts/git.ts \
            examples/scripts/preg.ts \
            examples/scripts/preg2.ts \
            examples/scripts/jwt.ts \
            examples/scripts/encrypt.ts \
            examples/scripts/sqlite.ts \
            examples/scripts/redis.ts \
            examples/scripts/memcached.ts \
            examples/scripts/ai.ts \
            examples/scripts/advanced/sqlite-etl.ts \
            examples/scripts/advanced/sqlite-migration.ts \
            examples/scripts/advanced/crypto-pipeline.ts \
            examples/scripts/advanced/codec-interop.ts

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      # Fail on any non-gofmt-formatted file (mirrors `make fmt-check`; fix
      # with `make fmt`). Kept as an explicit step rather than a golangci-lint
      # formatter so the signal is unambiguous and independent of linter config.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted (run 'make fmt'):"
            echo "$unformatted"
            exit 1
          fi
      - uses: golangci/golangci-lint-action@v7
        with:
          # Pinned to match `make lint`'s one-shot fallback so contributors
          # see the same rule set locally and in CI. golangci-lint v2 needs
          # action v7+ (v6 rejects v2 version strings).
          version: v2.12.2

  dts:
    name: emit-dts is valid TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: build
        env:
          CGO_ENABLED: '0'
        run: go build -o sercon ./cmd/sercon
      # The whole point of --emit-dts is editor/tsc consumption (MANUAL §14),
      # so type-check the emitted declaration file. sercon scripts run on goja,
      # not a browser, so es2020 (no DOM) is the right lib.
      - name: emit + typecheck sercon.d.ts
        run: |
          ./sercon --emit-dts /tmp/sercon.d.ts
          npx -y -p typescript@5 tsc --noEmit --lib es2020 /tmp/sercon.d.ts
